[package]
name = "towers"
description = "Towers — a co-op tower defense; slice 1 is the solo loop on a hardcoded map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cdylib` for the browser demo the next slice publishes, `rlib` so the binary
# and the tests share one crate — the same pair every sample uses. See
# `apps/breakout/Cargo.toml` for why both names are needed.
[lib]
name = "crcbl_towers"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "towers"
path = "src/main.rs"

# One engine dependency, like every other sample — with the `greybox` feature
# on, which is what the field is built out of. The ground slab, the lane the
# creeps walk, the build pads, the creeps and the towers are every one of them a
# `crcbl::greybox` primitive over a constant in `src/map.rs` that the colliders
# are written from too.
#
# The `scene` feature stays off: nothing here imports a glTF document, and
# milestone 1's map is a hardcoded table rather than a `.scn/` directory — see
# `docs/plan/sample/07-towers.md`, whose milestone 2 is where the map comes out
# of the editor.
[dependencies]
crcbl = { workspace = true, features = ["greybox"] }

# The helpers this sample's own unit tests read a frame back with — `ui_text`,
# `row_value` and `headless_common`, each a fact about an engine surface that
# every sample had written out for itself. A dev-dependency, so it reaches no
# shipped binary; see `apps/crcbl-sample-test/Cargo.toml`.
[dev-dependencies]
crcbl-sample-test = { workspace = true }

[lints]
workspace = true
