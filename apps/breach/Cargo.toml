[package]
name = "breach"
description = "Breach — first person, one hitscan pistol, two maps: a firing range and a bot practice arena"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cdylib` for the browser demo, `rlib` so the binary and the tests share one
# crate — the same pair every sample uses. See `apps/breakout/Cargo.toml` for
# why both names are needed.
[lib]
name = "crcbl_breach"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "breach"
path = "src/main.rs"

# One engine dependency, like every other sample — with two of its optional
# kits. `greybox` is what the range is built out of: the room is a floor, four
# walls, a ceiling, a firing line and three target plates, and every one of them
# is a `crcbl::greybox` primitive over one set of numbers `src/map.rs` also
# writes the colliders from. `inventory` is `crcbl-inventory`, the grid kit of
# `docs/plan/34-inventory.md`: this sample is its **second** consumer, after
# `apps/shard`, and it consumes it through `crcbl::inventory` rather than by
# naming the crate itself, so a game that takes the kit takes it the way every
# other kit here is taken.
#
# The `scene` feature stays off: nothing here imports a glTF document, and
# milestone 0's player is invisible, so there is no character asset either.
[dependencies]
crcbl = { workspace = true, features = ["greybox", "inventory"] }

[lints]
workspace = true
