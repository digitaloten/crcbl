[package]
name = "puppet"
description = "Puppet — third-person character playground: map, capsule controller and follow camera"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cdylib` for the browser demo, `rlib` so the binary and the tests share one
# crate — the same pair every sample uses. See `apps/breakout/Cargo.toml` for
# why both names are needed.
[lib]
name = "crcbl_puppet"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "puppet"
path = "src/main.rs"

# One engine dependency, like every other sample — with two features on.
#
# `greybox` is what this sample is the first consumer of. The map is ground, two
# mounds and two steps, and `crcbl::greybox`'s primitives are where the geometry
# for each of them comes from; writing a second cuboid generator here would be a
# copy of the one the engine already ships.
#
# `scn` is the scene *format* half of `crcbl::scene` — `crcbl_scene::scn`, the
# `.scn/` directory `assets/scenes/blockout.scn/` is one of. Not `scene`: that
# feature turns on the glTF importer as well, nothing here imports a glTF
# document, and milestone 1 has no character asset at all. See
# `crates/crcbl/Cargo.toml`, where the two are split for exactly this build.
[dependencies]
crcbl = { workspace = true, features = ["greybox", "scn"] }

# The helpers this sample's own unit tests read a frame back with — `ui_text`,
# `row_value` and `headless_common`, each a fact about an engine surface that
# every sample had written out for itself. A dev-dependency, so it reaches no
# shipped binary; see `apps/crcbl-sample-test/Cargo.toml`.
[dev-dependencies]
crcbl-sample-test = { workspace = true }

[lints]
workspace = true
