[package]
name = "shard"
description = "Shard — a torch-lit interior zone walked in an isometric-ish third person, on the raster fallback paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cdylib` for the browser demo, `rlib` so the binary and the tests share one
# crate — the same pair every sample uses. See `apps/breakout/Cargo.toml` for
# why both names are needed.
[lib]
name = "crcbl_shard"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "shard"
path = "src/main.rs"

# One engine dependency, like every other sample — with the `greybox` feature
# on, which is what the zone is assembled out of. Every wall block, floor slab,
# pillar, dais, brazier and doorway is a `crcbl::greybox` primitive placed on a
# tile of `src/zone.rs`'s layout, and the colliders come off the same layout.
# The `scene` feature stays off: nothing here imports a glTF document, and the
# character is a `crcbl::greybox::capsule` rather than an authored rig — slice 1
# has no animation, so a skinned asset would be a second character system with
# nothing to drive it.
# One engine dependency, and two of its optional kits. `inventory` is
# `crcbl-inventory`, the grid-inventory kit of `docs/plan/34-inventory.md`: this
# sample is its first consumer, and it consumes it through `crcbl::inventory`
# rather than by naming the crate itself, so a game that takes the kit takes it
# the way every other kit here is taken.
[dependencies]
crcbl = { workspace = true, features = ["greybox", "inventory"] }

# `tests/golden.rs`'s image I/O — loading the reference, comparing, and writing
# the diff a failure leaves behind. A dev-dependency on `crcbl-golden`'s own
# manifest terms: nothing here reaches the shipped game or the wasm build.
[dev-dependencies]
crcbl-golden = { workspace = true }
crcbl-sample-test = { workspace = true }

[lints]
workspace = true

[features]
# `tests/golden.rs` — the zone from the fixed camera set, on each
# `GeometryPath` a capable adapter can be held down to, against the checked-in
# goldens. Feature-gated *and* `#[ignore]`d, the same pair `apps/lantern` and
# `apps/quarry` use: a plain `cargo test --workspace --all-features` on a
# machine with no GPU must stay green, and `tests/run-shard-golden.sh` is the
# only thing that turns both off — and it fails when the suite reports zero
# tests run.
golden-e2e = []
