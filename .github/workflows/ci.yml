name: Metal hosted diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Run full Metal validation on macOS 15
        shell: bash
        env:
          CRCBL_GPU: mtl
          CRCBL_MTL_VALIDATION: '1'
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: assert
          MTL_DEBUG_LAYER_WARNING_MODE: assert
          MTL_SHADER_VALIDATION: '1'
          MTL_SHADER_VALIDATION_ENABLE_ERROR_REPORTING: '1'
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: '1'
          MTL_SHADER_VALIDATION_ABORT_ON_FAULT: '1'
        run: |
          set -euo pipefail
          mkdir probe-logs
          set +e
          crates/crcbl-mtl/tests/run-mtl-e2e.sh --no-fail-fast --test-threads=1 \
            -E 'not test(a_layer_swapchain_acquires_a_drawable_and_presents_it)' \
            > probe-logs/hardware-macos-15.log 2>&1
          hardware=$?
          crates/crcbl/tests/run-render-e2e.sh --no-fail-fast --test-threads=1 \
            > probe-logs/renderer-macos-15.log 2>&1
          renderer=$?
          set -e
          echo "hardware-macos-15 exit=$hardware" | tee probe-logs/results.txt
          echo "renderer-macos-15 exit=$renderer" | tee -a probe-logs/results.txt
          tail -160 probe-logs/hardware-macos-15.log
          tail -240 probe-logs/renderer-macos-15.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metal-hosted-probe
          path: probe-logs
          retention-days: 3
