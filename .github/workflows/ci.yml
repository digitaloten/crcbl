name: Metal hosted diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Run renderer validation on macOS 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir probe-logs
          set +e
          CRCBL_GPU=mtl MTL_DEBUG_LAYER=1 MTL_DEBUG_LAYER_ERROR_MODE=assert \
            MTL_DEBUG_LAYER_WARNING_MODE=assert MTL_SHADER_VALIDATION=1 \
            MTL_SHADER_VALIDATION_ENABLE_ERROR_REPORTING=1 \
            MTL_SHADER_VALIDATION_REPORT_TO_STDERR=1 \
            cargo nextest run --locked -p crcbl --features render-e2e --test render_e2e \
            --run-ignored all --no-tests fail --no-fail-fast --test-threads=1 \
            --success-output immediate \
            -E 'test(the_cube_scene_draws_through_the_forward_renderer_and_matches_its_golden) | test(the_ui_scene_draws_through_the_ui_renderer_and_matches_its_golden) | test(a_fragment_crossing_a_clipmap_level_fades_into_it)' \
            > probe-logs/renderer-macos-15.log 2>&1
          result=$?
          set -e
          echo "renderer-macos-15 exit=$result" | tee probe-logs/results.txt
          tail -240 probe-logs/renderer-macos-15.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metal-hosted-probe
          path: probe-logs
          retention-days: 3
