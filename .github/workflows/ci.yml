name: Metal hosted diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Compile every committed MSL artifact on macOS 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir probe-logs
          set +e
          compiled=0
          for source in crates/crcbl-shaders/msl/*.metal; do
            xcrun metal -c "$source" -o /dev/null \
              >> probe-logs/msl-macos-15.log 2>&1 || break
            compiled=$((compiled + 1))
          done
          set -e
          echo "msl-macos-15 compiled=$compiled" | tee probe-logs/results.txt
          cat probe-logs/msl-macos-15.log
          test "$compiled" -eq 45
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metal-hosted-probe
          path: probe-logs
          retention-days: 3
