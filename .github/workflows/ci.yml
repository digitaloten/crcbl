name: Metal hosted diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Run strict forward validation on macOS 15
        shell: bash
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: assert
          MTL_DEBUG_LAYER_WARNING_MODE: assert
          MTL_SHADER_VALIDATION: '1'
          MTL_SHADER_VALIDATION_ENABLE_ERROR_REPORTING: '1'
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: '1'
          MTL_SHADER_VALIDATION_ABORT_ON_FAULT: '1'
        run: |
          set -euo pipefail
          mkdir probe-logs
          crates/crcbl/tests/run-forward-e2e.sh --no-fail-fast --test-threads=1 \
            2>&1 | tee probe-logs/forward-macos-15.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metal-hosted-probe
          path: probe-logs
          retention-days: 3
